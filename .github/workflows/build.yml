name: Build Mac installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal - Apple Silicon + Intel)"
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build AU + VST3
        run: |
          cmake --build build --config Release --target Spread_AU Spread_VST3 -- -quiet 2>&1 | tee build.log
          test -d build/Spread_artefacts/Release/AU/SuperSpread.component
          test -d build/Spread_artefacts/Release/VST3/SuperSpread.vst3

      - name: Sign (ad-hoc) and package
        run: |
          set -e
          VER=$(grep -m1 'project(Spread VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          mkdir -p stage/au stage/vst3 dist
          cp -R build/Spread_artefacts/Release/AU/SuperSpread.component stage/au/
          cp -R build/Spread_artefacts/Release/VST3/SuperSpread.vst3 stage/vst3/
          codesign --force --deep --sign - stage/au/SuperSpread.component
          codesign --force --deep --sign - stage/vst3/SuperSpread.vst3
          # remove the old "Spread" test builds so Logic doesn't list two plugins
          mkdir -p scripts && cat > scripts/preinstall <<'SH'
          #!/bin/sh
          rm -rf "/Library/Audio/Plug-Ins/Components/Spread.component" "/Library/Audio/Plug-Ins/VST3/Spread.vst3"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Spread.component" "$HOME/Library/Audio/Plug-Ins/VST3/Spread.vst3"
          exit 0
          SH
          chmod +x scripts/preinstall
          pkgbuild --root stage/au --install-location /Library/Audio/Plug-Ins/Components --scripts scripts \
            --identifier com.mauaudio.superspread.au --version "$VER" au.pkg
          pkgbuild --root stage/vst3 --install-location /Library/Audio/Plug-Ins/VST3 \
            --identifier com.mauaudio.superspread.vst3 --version "$VER" vst3.pkg
          productbuild --package au.pkg --package vst3.pkg "dist/SuperSpread-$VER-Installer.pkg"
          lipo -info stage/au/SuperSpread.component/Contents/MacOS/SuperSpread | tee dist/architectures.txt

      - name: Install on the build Mac and run Apple's AU validator (auval)
        run: |
          sudo installer -pkg dist/SuperSpread-*-Installer.pkg -target /
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Sprd Mauf 2>&1 | tee dist/auval.log
          grep -q "AU VALIDATION SUCCEEDED" dist/auval.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spread-Mac-Installer
          path: |
            dist/
            build.log

      - name: Publish a download page (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'project(Spread VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          TAG="v$VER-build${{ github.run_number }}"
          gh release create "$TAG" dist/SuperSpread-*-Installer.pkg dist/auval.log \
            --title "SuperSpread $VER test build ${{ github.run_number }}" \
            --notes-file installer/RELEASE_NOTES.md --prerelease
